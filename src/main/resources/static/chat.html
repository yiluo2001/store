<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini Chat - Store</title>
<link rel="stylesheet" href="main.css">
<script src="config.js"></script>
<style>
    /* Chat Box Layout Styles */
    .chat-container {
        display: flex;
        flex-direction: column;
        height: 500px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        background: #ffffff;
        margin-top: 15px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .chat-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .message {
        max-width: 75%;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 14px;
        line-height: 1.5;
        word-wrap: break-word;
    }
    .user-message {
        align-self: flex-end;
        background-color: #007bff;
        color: white;
        border-bottom-right-radius: 2px;
    }
    .ai-message {
        align-self: flex-start;
        background-color: #f1f3f5;
        color: #333;
        border-bottom-left-radius: 2px;
    }
    .ai-message.loading {
        color: #888;
        font-style: italic;
    }
    .chat-input-area {
        display: flex;
        padding: 12px;
        border-top: 1px solid #e0e0e0;
        background: #fafafa;
        border-bottom-left-radius: 8px;
        border-bottom-right-radius: 8px;
    }
    .chat-input-area input {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid #ced4da;
        border-radius: 4px;
        outline: none;
        font-size: 14px;
    }
    .chat-input-area input:focus {
        border-color: #007bff;
    }
    .chat-input-area button {
        margin-left: 10px;
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
    }
    .chat-input-area button:hover {
        background-color: #0056b3;
    }
</style>
</head>

<body>
<div class="page-wrapper">
    <div class="paper">
        <!-- part 1 -->
        <header class="paper-header">
            <div class="breadcrumbs">
                <a href="https://www.yiluo.de">Yi Luo</a>
            </div>
        </header>

        <!-- part 2 -->
        <div class="paper-top-strip">
            <nav class="main-nav" style="display: flex;">
                <a href="products.html">Products</a>
                <a href="cart.html">Cart</a>
                <a href="orders.html">Orders</a>
            </nav>
        </div>
        
        <!-- part 3 -->
        <main class="paper-content">
            <h1>AI Assistant Chat</h1>
            <p>Chat directly with your Gemini-powered assistant running through your backend proxy.</p>
            
            <div class="chat-container">
                <div id="chat-messages" class="chat-messages">
                    <div class="message ai-message">Hello! How can I help you today?</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Type your message here..." autocomplete="off">
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user-message');
            chatInput.value = '';
            scrollToBottom();

            const loadingId = appendMessage('Thinking...', 'ai-message loading');
            scrollToBottom();

            try {
                const response = await fetch(`${BASE_URL}/api/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) throw new Error('Failed to connect to backend');

                const data = await response.json();
                
                document.getElementById(loadingId).remove();
                appendMessage(data.reply, 'ai-message');
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('Error: Unable to reach the chat server.', 'ai-message');
            }
            scrollToBottom();
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = text;
            const uniqueId = 'msg-' + Date.now() + '-' + Math.random().toString(36).substring(2, 9);
            msgDiv.id = uniqueId;
            chatMessages.appendChild(msgDiv);
            return uniqueId;
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    });
const BASE_URL = window.location.hostname === 'localhost'
    ? 'http://localhost:8080'
    // : 'https://store-8sau.onrender.com';
    : 'https://api.yiluo.de';
</script>
</body>
</html>
